# Storefront routing for the LIVE (systemd) nginx.
#
# This is the non-container equivalent of the storefront `location` blocks in
# frontend/nginx/default.conf. The two must stay in step — they express the
# same routing table for two different deployment shapes.
#
# Install by including it inside the existing `server { }` block for the site:
#
#   sudo cp deploy/nginx-storefront.conf /etc/nginx/snippets/
#   # then, inside server { } in the site config, ABOVE the SPA's `location /`:
#   include /etc/nginx/snippets/nginx-storefront.conf;
#   sudo nginx -t && sudo systemctl reload nginx
#
# Order matters. These must come before the SPA's `location / { try_files ... }`
# or nginx will keep serving the old React pages.
#
# To roll the storefront back: comment out the include and reload. Every route
# falls through to the SPA, which still has its own homepage and product pages.
# That is why they have not been deleted.

location /_next/static/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location /_next/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Exact match: the site root only, not every path under it.
location = / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /products {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

