location = /sitemap.xml {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /robots.txt {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The SPA's cart page is superseded by the storefront's cart drawer, and the
# two keep separate baskets in localStorage — a customer landing on the old
# page would see an empty cart and think the site lost their order.
location = /cart {
    return 301 /checkout;
}
