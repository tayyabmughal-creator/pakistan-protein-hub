server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product images are uploaded at runtime, so they can be large. The default
    # 1 MB limit rejected them with an opaque 413.
    client_max_body_size 12m;

    # Do not advertise the nginx version to anyone scanning.
    server_tokens off;

    # Correlation id: reuse the caller's if present, otherwise mint one, and
    # hand it to the backend so one id follows a request across both tiers.
    set $request_id_final $http_x_request_id;
    if ($request_id_final = "") {
        set $request_id_final $request_id;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------------
    # Routing
    #
    # Three things live behind this one edge:
    #
    #   storefront (Next.js)  the public catalogue funnel — home, products,
    #                         categories, deals, checkout, tracking
    #   frontend   (Vite SPA) everything behind a login — account, orders,
    #                         profile, and the staff admin screens
    #   backend    (Django)   the API, Django admin, static and media
    #
    # Order matters: nginx picks the longest matching prefix, and the SPA's
    # try_files fallback in `location /` is deliberately last so it only
    # catches what nothing else claimed.
    # ------------------------------------------------------------------

    # --- storefront ---------------------------------------------------

    # Build assets. Content-hashed, so cache them hard.
    location /_next/static/ {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else Next serves for itself, including the image optimiser
    # at /_next/image. Not cached here — the optimiser sets its own headers.
    location /_next/ {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Exact match: only the site root, not every path beginning with "/".
    location = / {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /products {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /categories {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /deals {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /checkout {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /track {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /order-confirmation/ {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /sitemap.xml {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location = /robots.txt {
        proxy_pass http://storefront:3000;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # The SPA's cart page is superseded by the storefront's cart drawer, and
    # the two keep separate baskets in localStorage — a customer landing on the
    # old page would see an empty cart and conclude the site lost their order.
    # 301 rather than 302: the old page is not coming back.
    location = /cart {
        return 301 /checkout;
    }

    # --- backend ------------------------------------------------------

    location /api/ {
        proxy_pass http://backend:8000/api/;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Django's own admin, at the obscured prefix ADMIN_URL sets.
    #
    # This used to be `location /admin/`, which was wrong in two ways: it sent
    # the SPA's staff screens (/admin/orders, /admin/inventory, …) to Django,
    # which has no route for them and answered 404; and it assumed Django admin
    # was at /admin/, which it is not when ADMIN_URL is set — as .env.example
    # instructs and as `validate_production_settings` now requires.
    location /secure-admin/ {
        proxy_pass http://backend:8000/secure-admin/;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Django's own static files (admin CSS/JS, DRF browsable API). Served by
    # whitenoise from inside the backend image rather than a shared volume, so
    # the image stays the single immutable artefact.
    location /static/ {
        proxy_pass http://backend:8000/static/;
        include /etc/nginx/conf.d/proxy_headers.inc;
        access_log off;
        expires 30d;
    }

    # Uploaded media is written at runtime and lives on a volume.
    location /media/ {
        alias /vol/media/;
        access_log off;
        expires 30d;
    }

    # Liveness of the whole edge: proves nginx is up and the backend answers.
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        include /etc/nginx/conf.d/proxy_headers.inc;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://backend:8000/readyz;
        include /etc/nginx/conf.d/proxy_headers.inc;
        access_log off;
    }

    # --- SPA (everything not claimed above) ---------------------------

    # Vite build output is content-hashed, so it can be cached indefinitely.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # previous build's asset URLs, which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # /login, /register, /orders, /profile, /admin/*, /payment-status, …
    location / {
        try_files $uri $uri/ /index.html;
    }
}
