server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Product images are uploaded at runtime, so they can be large. The default
    # 1 MB limit rejected them with an opaque 413.
    client_max_body_size 12m;

    # Do not advertise the nginx version to anyone scanning.
    server_tokens off;

    # Correlation id: reuse the caller's if present, otherwise mint one, and
    # hand it to the backend so one id follows a request across both tiers.
    set $request_id_final $http_x_request_id;
    if ($request_id_final = "") {
        set $request_id_final $request_id;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build output is content-hashed, so it can be cached indefinitely.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # previous build's asset URLs, which no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        include /etc/nginx/conf.d/proxy_headers.inc;
    }

    # Django's own static files (admin CSS/JS, DRF browsable API). Served by
    # whitenoise from inside the backend image rather than a shared volume, so
    # the image stays the single immutable artefact.
    location /static/ {
        proxy_pass http://backend:8000/static/;
        include /etc/nginx/conf.d/proxy_headers.inc;
        access_log off;
        expires 30d;
    }

    # Uploaded media is written at runtime and lives on a volume.
    location /media/ {
        alias /vol/media/;
        access_log off;
        expires 30d;
    }

    # Liveness of the whole edge: proves nginx is up and the backend answers.
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        include /etc/nginx/conf.d/proxy_headers.inc;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://backend:8000/readyz;
        include /etc/nginx/conf.d/proxy_headers.inc;
        access_log off;
    }
}
