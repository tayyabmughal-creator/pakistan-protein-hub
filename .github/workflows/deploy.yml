name: Deploy Full Project

on:
  push:
    branches:
      - main

jobs:
  # Nothing reaches the VPS unless every gate passes. This used to deploy
  # straight from a push with no tests, no lint, no typecheck and no secret scan.
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "Going to project folder"
            cd ${{ secrets.PROJECT_PATH }}

            echo "Checking backend environment"
            test -f backend/.env || (echo "Missing backend/.env" && exit 1)
            test -f frontend/.env || (echo "Missing frontend/.env" && exit 1)

            # --- Pre-deploy backup -------------------------------------------
            # `git reset --hard` below overwrites the working tree. Anything
            # tracked is replaced with the committed copy, and anything removed
            # from the index in the incoming commit is DELETED. backend/db.sqlite3
            # is no longer tracked, so a SQLite deployment would lose its database
            # on the first deploy after that change. Back up first, every time.
            echo "Taking a pre-deploy backup"
            BACKUP_DIR="${HOME}/paknutrition-backups"
            mkdir -p "$BACKUP_DIR"
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"

            if [ -f backend/db.sqlite3 ]; then
              cp backend/db.sqlite3 "$BACKUP_DIR/db.sqlite3.$STAMP"
              echo "Backed up backend/db.sqlite3 to $BACKUP_DIR/db.sqlite3.$STAMP"
            fi

            # shellcheck disable=SC1091
            set -a; . backend/.env; set +a
            if [ -n "${POSTGRES_DB:-}" ]; then
              echo "Backing up PostgreSQL database ${POSTGRES_DB}"
              PGPASSWORD="${POSTGRES_PASSWORD}" pg_dump \
                -h "${POSTGRES_HOST:-localhost}" -p "${POSTGRES_PORT:-5432}" \
                -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -Fc \
                -f "$BACKUP_DIR/paknutrition.$STAMP.dump"
              echo "Backed up to $BACKUP_DIR/paknutrition.$STAMP.dump"
            else
              echo "WARNING: POSTGRES_DB is not set — this deployment is on SQLite."
            fi

            # Keep the 14 most recent of each kind.
            ls -1t "$BACKUP_DIR"/paknutrition.*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
            ls -1t "$BACKUP_DIR"/db.sqlite3.* 2>/dev/null | tail -n +15 | xargs -r rm -f
            # ------------------------------------------------------------------

            echo "Resetting server repo to origin/main"
            git fetch origin main
            git reset --hard origin/main

            echo "Setting up backend virtual environment"
            cd backend
            if [ -d ".venv" ]; then
              VENV_PATH=".venv"
            elif [ -d "venv" ]; then
              VENV_PATH="venv"
            else
              python3 -m venv .venv
              VENV_PATH=".venv"
            fi
            . "${VENV_PATH}/bin/activate"

            echo "Installing backend dependencies"
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "Validating configured database connection"
            python manage.py shell -c "from django.conf import settings; db = settings.DATABASES['default']; print(f\"ENGINE={db.get('ENGINE')}\"); print(f\"NAME={db.get('NAME')}\"); print(f\"HOST={db.get('HOST', '')}\")"

            echo "Running backend migrations"
            python manage.py migrate --noinput

            echo "Collecting static files"
            python manage.py collectstatic --noinput

            echo "Running Django system checks"
            python manage.py check

            echo "Building frontend"
            cd ../frontend
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build

            echo "Restarting application services"
            sudo systemctl restart ${{ secrets.GUNICORN_SERVICE }}
            sudo systemctl restart ${{ secrets.NGINX_SERVICE }}

            echo "Verifying service status"
            sudo systemctl is-active ${{ secrets.GUNICORN_SERVICE }}
            sudo systemctl is-active ${{ secrets.NGINX_SERVICE }}

            echo "Deployment completed successfully"
