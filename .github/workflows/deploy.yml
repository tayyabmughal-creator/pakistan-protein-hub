name: Deploy Full Project

on:
  push:
    branches:
      - main

jobs:
  # Nothing reaches the VPS unless every gate passes. This used to deploy
  # straight from a push with no tests, no lint, no typecheck and no secret scan.
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            echo "Going to project folder"
            cd ${{ secrets.PROJECT_PATH }}

            echo "Checking backend environment"
            test -f backend/.env || (echo "Missing backend/.env" && exit 1)
            test -f frontend/.env || (echo "Missing frontend/.env" && exit 1)

            # --- Pre-deploy backup -------------------------------------------
            # `git reset --hard` below overwrites the working tree. Anything
            # tracked is replaced with the committed copy, and anything removed
            # from the index in the incoming commit is DELETED. backend/db.sqlite3
            # is no longer tracked, so a SQLite deployment would lose its database
            # on the first deploy after that change. Back up first, every time.
            echo "Taking a pre-deploy backup"
            BACKUP_DIR="${HOME}/paknutrition-backups"
            mkdir -p "$BACKUP_DIR"
            STAMP="$(date -u +%Y%m%dT%H%M%SZ)"

            if [ -f backend/db.sqlite3 ]; then
              cp backend/db.sqlite3 "$BACKUP_DIR/db.sqlite3.$STAMP"
              echo "Backed up backend/db.sqlite3 to $BACKUP_DIR/db.sqlite3.$STAMP"
            fi

            # Read the few values needed, rather than sourcing the file.
            # `set -a; . backend/.env` looked tidier but executes it as shell:
            # a Django SECRET_KEY contains characters like # ( ) $ & and the
            # real production file aborts the deploy with a syntax error on
            # line 2. Values are taken literally here, quotes stripped, and
            # nothing in the file is ever executed.
            envget() {
              sed -n "s/^$1=//p" backend/.env | head -1 | sed -e "s/^[\"']//" -e "s/[\"']$//"
            }
            PG_DB="$(envget POSTGRES_DB)"
            PG_USER="$(envget POSTGRES_USER)"
            PG_HOST="$(envget POSTGRES_HOST)"
            PG_PORT="$(envget POSTGRES_PORT)"

            if [ -n "${PG_DB:-}" ]; then
              echo "Backing up PostgreSQL database ${PG_DB}"
              # Password read at the point of use and never held in a named
              # variable, so it cannot be echoed by a later `set -x`.
              PGPASSWORD="$(envget POSTGRES_PASSWORD)" pg_dump \
                -h "${PG_HOST:-localhost}" -p "${PG_PORT:-5432}" \
                -U "${PG_USER}" -d "${PG_DB}" -Fc \
                -f "$BACKUP_DIR/paknutrition.$STAMP.dump"
              echo "Backed up to $BACKUP_DIR/paknutrition.$STAMP.dump"
            else
              echo "WARNING: POSTGRES_DB is not set — this deployment is on SQLite."
            fi

            # Keep the 14 most recent of each kind.
            ls -1t "$BACKUP_DIR"/paknutrition.*.dump 2>/dev/null | tail -n +15 | xargs -r rm -f
            ls -1t "$BACKUP_DIR"/db.sqlite3.* 2>/dev/null | tail -n +15 | xargs -r rm -f
            # ------------------------------------------------------------------

            echo "Resetting server repo to origin/main"
            git fetch origin main
            git reset --hard origin/main

            # The .env files are not kept in the working tree — they are
            # restored from ~/envs on every deploy. `~/envs/backend.env.backup`
            # is the source of truth for production configuration; editing
            # backend/.env directly is pointless because this overwrites it.
            echo "Restoring environment files from ~/envs"
            cp ~/envs/backend.env.backup backend/.env
            cp ~/envs/frontend.env.backup frontend/.env

            echo "Setting up backend virtual environment"
            cd backend
            if [ -d ".venv" ]; then
              VENV_PATH=".venv"
            elif [ -d "venv" ]; then
              VENV_PATH="venv"
            else
              python3 -m venv .venv
              VENV_PATH=".venv"
            fi
            . "${VENV_PATH}/bin/activate"

            echo "Installing backend dependencies"
            pip install --upgrade pip
            pip install -r requirements.txt

            echo "Running migrations"
            python manage.py migrate --noinput

            echo "Collecting static files"
            python manage.py collectstatic --noinput

            echo "Running system checks"
            python manage.py check

            echo "Building frontend"
            cd ../frontend
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build

            cd ..

            # The backend restarts BEFORE the storefront builds, on purpose.
            # The storefront prerenders pages by calling the API, so it must
            # call the *new* one — on the first deploy that adds a storefront
            # endpoint, building against the still-running old process would
            # fail with 404s after the migrations had already been applied.
            echo "Restarting backend"
            sudo systemctl restart ${{ secrets.GUNICORN_SERVICE }}

            echo "Waiting for the API to become ready"
            for attempt in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/readyz >/dev/null 2>&1; then
                echo "API ready after ${attempt}s"
                break
              fi
              if [ "$attempt" = "30" ]; then
                echo "ERROR: API never became ready; not building the storefront"
                sudo journalctl -u ${{ secrets.GUNICORN_SERVICE }} -n 50 --no-pager
                exit 1
              fi
              sleep 1
            done

            # The storefront is opt-in, gated on its systemd unit existing.
            #
            # The live box runs ~10 unrelated sites on a shared Node 18, and
            # Next.js 15 wants Node 20+. Building unconditionally would fail
            # the deploy on a box that has not been prepared — after the
            # migrations had already run. Install the unit (see
            # deploy/STOREFRONT_SETUP.md) to turn this on.
            if ! systemctl list-unit-files | grep -q "^paknutrition-storefront.service"; then
              echo "Storefront not enabled on this host — skipping its build."
              echo "See deploy/STOREFRONT_SETUP.md to enable it."
              echo "Deployment completed successfully (backend + SPA)"
              exit 0
            fi

            if [ -z "${{ secrets.STOREFRONT_SITE_URL }}" ]; then
              echo "The storefront is enabled but STOREFRONT_SITE_URL is not set."
              echo "It is baked into the bundle at build time and sets every"
              echo "canonical URL, so a wrong or missing value cannot be fixed"
              echo "by restarting. Set it to the public origin."
              exit 1
            fi

            echo "Building storefront"
            cd storefront
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            # Baked into the client bundle at build time, so it cannot be fixed
            # by restarting the service. A wrong value puts the wrong host in
            # every canonical tag and sitemap entry.
            export NEXT_PUBLIC_SITE_URL="${{ secrets.STOREFRONT_SITE_URL }}"
            export NEXT_PUBLIC_MEDIA_HOST="${{ secrets.STOREFRONT_MEDIA_HOST }}"
            # A build against an unreachable API fails here rather than
            # shipping an empty catalogue, which looks identical to a real one
            # and would be cached and indexed as such.
            export API_BASE_URL="http://127.0.0.1:8000"
            npm run build

            cd ..

            # Skipped until the unit is installed by hand (see
            # deploy/paknutrition-storefront.service), so adding the storefront
            # to the repository does not break deploys on a box that has not
            # been set up for it yet.
            if systemctl list-unit-files | grep -q '^paknutrition-storefront.service'; then
              echo "Restarting storefront"
              sudo systemctl restart paknutrition-storefront
            else
              echo "NOTE: paknutrition-storefront.service is not installed — skipping."
              echo "      The storefront was built but is not being served."
            fi

            sudo systemctl restart ${{ secrets.NGINX_SERVICE }}

            echo "Checking services"
            sudo systemctl is-active ${{ secrets.GUNICORN_SERVICE }}
            sudo systemctl is-active ${{ secrets.NGINX_SERVICE }}
            if systemctl list-unit-files | grep -q '^paknutrition-storefront.service'; then
              sudo systemctl is-active paknutrition-storefront

              # Prove it renders, not just that systemd thinks it is running.
              for attempt in $(seq 1 20); do
                if curl -fsS http://127.0.0.1:3000/robots.txt >/dev/null 2>&1; then
                  echo "Storefront responding"
                  break
                fi
                if [ "$attempt" = "20" ]; then
                  echo "ERROR: storefront never responded"
                  sudo journalctl -u paknutrition-storefront -n 50 --no-pager
                  exit 1
                fi
                sleep 1
              done
            fi

            echo "Deployment completed successfully"
