name: CI

# Every deployment candidate runs these. The deploy workflow waits on this one,
# so a failing gate means nothing reaches the VPS.

#
# No `push: main` trigger: the deploy workflow already runs this on every push
# to main. Having both put two runs in the same concurrency group, and
# cancel-in-progress killed whichever started first — the standalone run
# every time so far, but on the other ordering the deploy's own gate, failing
# the deploy.
on:
  pull_request:
  workflow_call:

concurrency:
  # github.workflow is the caller's name under workflow_call, so a deploy's
  # gate and a PR run never share a group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Secrets and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan sees what is actually tracked.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for secrets, database dumps and PII exports
        run: python scripts/check_repo_hygiene.py

  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Concurrency and locking behaviour differ between SQLite and PostgreSQL —
    # select_for_update is a silent no-op on SQLite. Tests run against the
    # engine production uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paknutrition_test
          POSTGRES_USER: paknutrition
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else-000000
      # Tests and the plain system check run as a development configuration.
      # The production-shaped checks below set DEBUG=0 explicitly, which is what
      # triggers the settings-time configuration validation.
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: paknutrition_test
      POSTGRES_USER: paknutrition
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Deployment security check
        working-directory: backend
        env:
          # Production-shaped settings, so the security checks assess what
          # production will actually run. DEBUG=0 also makes settings run the
          # configuration validator, so this step proves a correct production
          # config is accepted — the refusal path is unit-tested in common/tests.
          DEBUG: "0"
          SECRET_KEY: ci-secret-key-long-enough-and-random-enough-for-checks-9f3a2b7c1d
          ALLOWED_HOSTS: shop.example.com
          CORS_ALLOWED_ORIGINS: https://shop.example.com
          CSRF_TRUSTED_ORIGINS: https://shop.example.com
          FRONTEND_URL: https://shop.example.com
          BACKEND_PUBLIC_URL: https://shop.example.com
          ADMIN_URL: ci-admin/
          SECURE_SSL_REDIRECT: "1"
          SESSION_COOKIE_SECURE: "1"
          CSRF_COOKIE_SECURE: "1"
          SECURE_HSTS_SECONDS: "31536000"
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_TASK_ALWAYS_EAGER: "0"
          ORDER_NOTIFICATION_EMAIL_ENABLED: "0"
          ORDER_NOTIFICATION_SMS_ENABLED: "0"
        # Scoped to the security tag: a warning here is a real deployment risk,
        # so WARNING is a fair failure threshold. Running every tag would fail
        # on drf-spectacular schema-completeness hints, which are not.
        run: python manage.py check --deploy --tag security --fail-level WARNING

      - name: Migrations are consistent with models
        working-directory: backend
        # Catches a model change committed without its migration, which would
        # otherwise only surface as a broken production deploy.
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply cleanly from empty
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Data integrity audit
        working-directory: backend
        # Catches what is legal in the database but wrong for the business:
        # products with no sellable variant, balances that disagree with the
        # stock ledger, paid orders that never drew down stock.
        run: python manage.py audit_legacy_data --strict

      - name: Migration verification round trip
        working-directory: backend
        # Proves the verifier itself works: snapshot, migrate, compare. A
        # migration that runs without error has proved nothing on its own.
        run: |
          python manage.py verify_migration --snapshot "$RUNNER_TEMP/state.json"
          python manage.py migrate --noinput
          python manage.py verify_migration --compare "$RUNNER_TEMP/state.json" --allow-growth

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Tests
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
        run: npm run build

  storefront:
    name: Storefront
    runs-on: ubuntu-latest

    # The storefront prerenders pages against a live API at build time, so this
    # job stands one up. That is not incidental: it means a change to a
    # serializer that the storefront reads fails here, at build time, instead of
    # rendering a blank homepage in production.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paknutrition_storefront
          POSTGRES_USER: paknutrition
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else-000000
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: paknutrition_storefront
      POSTGRES_USER: paknutrition
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CELERY_TASK_ALWAYS_EAGER: "1"
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      ORDER_NOTIFICATION_SMS_ENABLED: "0"
      ADMIN_PUSH_NOTIFICATIONS_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: storefront/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare a catalogue to render
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_drill_data

      - name: Start the API
        working-directory: backend
        run: |
          gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 \
            --access-logfile - --error-logfile - > "$RUNNER_TEMP/api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null 2>&1; then
              echo "Ready after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::API never became ready"
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Install storefront dependencies
        working-directory: storefront
        run: npm ci

      - name: Lint
        working-directory: storefront
        run: npx eslint src --max-warnings 0

      - name: Typecheck
        working-directory: storefront
        run: npx tsc --noEmit

      - name: Production build
        working-directory: storefront
        env:
          API_BASE_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SITE_URL: https://paknutrition.com
        run: |
          npm run build
          npm run assemble:standalone

      - name: Serve the built storefront and check it renders
        working-directory: storefront
        env:
          API_BASE_URL: http://127.0.0.1:8000
          PORT: "3000"
          HOSTNAME: 127.0.0.1
        # The standalone server, as production's systemd unit runs it.
        run: |
          node .next/standalone/server.js > "$RUNNER_TEMP/storefront.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/robots.txt >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          fail=0
          check() {
            actual=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$1")
            if [ "$actual" != "$2" ]; then
              echo "::error::$1 returned $actual, expected $2"
              fail=1
            else
              echo "ok  $1 -> $actual"
            fi
          }

          check / 200
          check /products 200
          check /categories 200
          check /deals 200
          check /checkout 200
          check /track 200
          check /sitemap.xml 200
          check /robots.txt 200

          # Linked from the nav and the footer. These 404'd for a while
          # because they were linked before they existed, which is a broken
          # link on every single page of the site.
          check /about 200
          check /contact 200
          check /faq 200
          check /shipping 200
          check /returns 200
          check /privacy 200
          check /terms 200

          # A missing product must answer 404, not 200 with not-found content.
          # A loading.tsx at the app root silently turned every one of these
          # into a soft 404 that Google would index as a real page; this is the
          # check that catches it coming back.
          check /products/definitely-not-a-real-product 404
          check /order-confirmation/not-a-number 404

          exit $fail

      - name: Storefront log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/storefront.log" "$RUNNER_TEMP/api.log" || true

  smoke:
    name: End-to-end smoke
    runs-on: ubuntu-latest

    # Runs the purchase path against a real running server: browse, place a
    # guest COD order, track it. Unit tests exercise views in isolation; this is
    # the check that the assembled application actually sells something.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paknutrition_smoke
          POSTGRES_USER: paknutrition
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else-000000
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: paknutrition_smoke
      POSTGRES_USER: paknutrition
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      # No mail server in CI; the console backend keeps notifications loggable.
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      ORDER_NOTIFICATION_SMS_ENABLED: "0"
      ADMIN_PUSH_NOTIFICATIONS_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare a database with something to sell
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_drill_data

      - name: Start the application
        working-directory: backend
        run: |
          gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 2 \
            --access-logfile - --error-logfile - > "$RUNNER_TEMP/server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz >/dev/null 2>&1; then
              echo "Ready after ${attempt}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::Server never became ready"
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Smoke test
        run: python scripts/smoke_test.py --base-url http://127.0.0.1:8000

      - name: Server log on failure
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  restore-drill:
    name: Backup and restore drill
    runs-on: ubuntu-latest

    # A backup that has never been restored is not a backup. This proves the
    # whole loop — dump, restore into a scratch database, count the rows — on
    # every push, so the runbook cannot rot into something that no longer works
    # by the time someone needs it at 2am.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paknutrition_drill
          POSTGRES_USER: paknutrition
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else-000000
      DEBUG: "1"
      POSTGRES_DB: paknutrition_drill
      POSTGRES_USER: paknutrition
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install PostgreSQL 16 client
        # The runner ships an older client; pg_dump refuses to dump a newer
        # server than itself, so match the server version explicitly.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          pg_dump --version

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build a database with data in it
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py seed_drill_data

      - name: Take a backup
        working-directory: backend
        run: python manage.py backup_database --output-dir "$RUNNER_TEMP/backups"

      - name: Restore it into a scratch database and verify the rows survived
        working-directory: backend
        run: |
          BACKUP=$(ls -1t "$RUNNER_TEMP/backups"/paknutrition*.dump | head -1)
          echo "Restoring $BACKUP"
          python manage.py restore_database "$BACKUP" --into-scratch-db | tee "$RUNNER_TEMP/drill.txt"
          # An exit code of 0 is not proof: pg_restore exits clean on an empty
          # dump. Fail if the drill reported any table as restoring empty.
          if grep -q "restored empty" "$RUNNER_TEMP/drill.txt"; then
            echo "::error::Restore drill produced empty tables. The backup is not usable."
            exit 1
          fi

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python dependency vulnerabilities
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict

      - name: npm dependency vulnerabilities (shipped code)
        working-directory: frontend
        # Gate on what actually reaches a customer's browser. High or critical
        # in a runtime dependency fails the build.
        run: npm audit --omit=dev --audit-level=high

      - name: npm dependency vulnerabilities (storefront)
        working-directory: storefront
        # The storefront runs as a server process, so a vulnerable dependency
        # is reachable from the internet rather than only in a customer's tab.
        # Blocking on the full tree, not just runtime deps.
        run: npm audit --audit-level=high

      - name: npm dependency vulnerabilities (build toolchain, advisory only)
        working-directory: frontend
        # Dev-only advisories (vite/esbuild dev-server issues) are worth seeing
        # but do not ship to customers, and the current ones have no non-major
        # fix. Reported, not blocking — revisit at the Next.js migration, which
        # replaces this toolchain outright.
        continue-on-error: true
        run: npm audit --audit-level=high
