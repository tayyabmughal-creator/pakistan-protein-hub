name: CI

# Every deployment candidate runs these. The deploy workflow waits on this one,
# so a failing gate means nothing reaches the VPS.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    name: Secrets and repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan sees what is actually tracked.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan for secrets, database dumps and PII exports
        run: python scripts/check_repo_hygiene.py

  backend:
    name: Backend
    runs-on: ubuntu-latest

    # Concurrency and locking behaviour differ between SQLite and PostgreSQL —
    # select_for_update is a silent no-op on SQLite. Tests run against the
    # engine production uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paknutrition_test
          POSTGRES_USER: paknutrition
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-secret-key-not-used-anywhere-else-000000
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: paknutrition_test
      POSTGRES_USER: paknutrition
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Django system check
        working-directory: backend
        run: python manage.py check

      - name: Deployment security check
        working-directory: backend
        env:
          # Production-shaped settings, so the security checks assess what
          # production will actually run.
          SECRET_KEY: ci-secret-key-long-enough-and-random-enough-for-checks-9f3a2b7c1d
          SECURE_SSL_REDIRECT: "1"
          SESSION_COOKIE_SECURE: "1"
          CSRF_COOKIE_SECURE: "1"
          SECURE_HSTS_SECONDS: "31536000"
        # Scoped to the security tag: a warning here is a real deployment risk,
        # so WARNING is a fair failure threshold. Running every tag would fail
        # on drf-spectacular schema-completeness hints, which are not.
        run: python manage.py check --deploy --tag security --fail-level WARNING

      - name: Migrations are consistent with models
        working-directory: backend
        # Catches a model change committed without its migration, which would
        # otherwise only surface as a broken production deploy.
        run: python manage.py makemigrations --check --dry-run

      - name: Migrations apply cleanly from empty
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Production build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000/api
        run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Python dependency vulnerabilities
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict

      - name: npm dependency vulnerabilities (shipped code)
        working-directory: frontend
        # Gate on what actually reaches a customer's browser. High or critical
        # in a runtime dependency fails the build.
        run: npm audit --omit=dev --audit-level=high

      - name: npm dependency vulnerabilities (build toolchain, advisory only)
        working-directory: frontend
        # Dev-only advisories (vite/esbuild dev-server issues) are worth seeing
        # but do not ship to customers, and the current ones have no non-major
        # fix. Reported, not blocking — revisit at the Next.js migration, which
        # replaces this toolchain outright.
        continue-on-error: true
        run: npm audit --audit-level=high
